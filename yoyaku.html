<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無料相談のご予約｜AI採用オペレーション代行｜株式会社NEXT</title>
<meta name="description" content="採用の工数をお伺いして、どれくらいAIに置き換えられるかを無料でご相談します。ご都合のよい日時をお選びください。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F7FC; --surface:#FFFFFF; --line:rgba(11,37,69,.16);
    --ink:#0B2545; --ink-dim:#3E5875;
    --accent:#1668C8; --accent-2:#0B4DA2; --navy:#0B2E63;
    --font-jp:"Noto Sans JP",sans-serif; --font-en:"Space Grotesk","Noto Sans JP",sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-jp); -webkit-font-smoothing:antialiased;
  }
  /* 上部：資料と同じ濃紺のブロック */
  .hd{
    background:linear-gradient(135deg,#0B2E63 0%,#12539F 55%,#1668C8 100%);
    color:#fff; padding:52px 24px 46px; text-align:center;
  }
  .hd-eyebrow{
    font-family:var(--font-en); font-size:.78rem; letter-spacing:.14em;
    color:rgba(255,255,255,.75); margin:0 0 14px;
  }
  .hd h1{
    margin:0 0 16px; font-size:clamp(1.7rem,4vw,2.7rem); font-weight:900;
    line-height:1.5; letter-spacing:-.015em;
  }
  .hd h1 .hl{ color:#8EC6FF; }
  .hd p{ margin:0; font-size:clamp(.9rem,1.6vw,1rem); font-weight:600; color:rgba(255,255,255,.9); line-height:1.8; }

  .hd-sub{ margin:0 !important; font-size:clamp(.95rem,1.7vw,1.1rem) !important; font-weight:700 !important; color:rgba(255,255,255,.86) !important; }

  /* 分かること：文章をやめて短い項目だけにする */
  .pts{
    max-width:900px; margin:22px auto 0; padding:0 20px;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .pts-h{ font-size:.82rem; font-weight:700; color:var(--ink-dim); margin-right:4px; }
  .pt{
    background:var(--surface); border:1px solid var(--line); border-radius:100px;
    padding:9px 20px; font-size:.92rem; font-weight:700; color:var(--accent-2);
    box-shadow:0 2px 8px rgba(11,37,69,.06);
  }

  /* カレンダー本体。等倍で置くので操作が崩れない */
  .cal{
    max-width:900px; margin:26px auto 0; padding:0 20px 60px;
  }
  .cal-h{
    font-size:1rem; font-weight:700; margin:0 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  .cal-h::before{ content:""; width:26px; height:2px; background:var(--accent); display:block; }
  .cal-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px; box-shadow:0 2px 10px rgba(11,37,69,.06), 0 12px 34px rgba(11,37,69,.05);
    min-height:520px;
  }
  .cal-fb{ margin:14px 0 0; font-size:.84rem; color:var(--ink-dim); line-height:1.8; }
  .cal-fb a{ color:var(--accent-2); font-weight:700; }

  .ft{ text-align:center; padding:0 20px 50px; font-size:.8rem; color:var(--ink-dim); }
  .ft a{ color:var(--accent-2); font-weight:700; text-decoration:none; }

  @media (max-width:760px){
    .pts{ gap:8px; }
    .hd{ padding:34px 18px 34px; }
  }
</style>
</head>
<body>

<header class="hd">
  <p class="hd-eyebrow">AI採用オペレーション代行｜株式会社NEXT</p>
  <h1>採用の工数、<br>どこまで<span class="hl">AIに任せられるか</span>。</h1>
  <p class="hd-sub">無料で診断します</p>
</header>

<section class="pts">
  <span class="pts-h">分かること</span>
  <span class="pt">いまの工数</span>
  <span class="pt">減らせる量</span>
  <span class="pt">費用の目安</span>
</section>

<main class="cal">
  <h2 class="cal-h">ご都合のよい日時をお選びください</h2>
  <div class="cal-box">
    <!-- TimeRex -->
    <div id="timerex_calendar" data-url="https://timerex.net/s/m.inoue_361c_6dde/3ffb8afc"></div>
  </div>
  <p class="cal-fb">
    カレンダーが表示されない場合は、
    <a href="https://timerex.net/s/m.inoue_361c_6dde/3ffb8afc" target="_blank" rel="noopener">こちらのページ</a>
    から直接ご予約いただけます。
  </p>
</main>

<footer class="ft">
  <a href="./">← 資料に戻る</a>
</footer>

<script id="timerex_embed" src="https://asset.timerex.net/js/embed.js"></script>
<script>
  // embed.js の読み込み完了を待ってから描画する（先に呼ぶと何も出ない）
  (function () {
    var tries = 0;
    (function go() {
      if (typeof TimerexCalendar === 'function') { TimerexCalendar(); return; }
      if (++tries > 40) return;          // 約8秒で諦め、上のリンクに誘導
      setTimeout(go, 200);
    })();
  })();
</script>

</body>
</html>
