<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無料相談のご予約｜AIまるごと採用雑務代行｜株式会社NEXT</title>
<meta name="description" content="採用の工数をお伺いして、どれくらいAIに置き換えられるかを無料でご相談します。ご都合のよい日時をお選びください。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F7FC; --surface:#FFFFFF; --line:rgba(11,37,69,.16);
    --ink:#0B2545; --ink-dim:#3E5875;
    --accent:#1668C8; --accent-2:#0B4DA2; --navy:#0B2E63;
    --font-jp:"Noto Sans JP",sans-serif; --font-en:"Space Grotesk","Noto Sans JP",sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-jp); -webkit-font-smoothing:antialiased;
  }
  /* 上部：資料と同じ濃紺のブロック */
  .hd{
    background:linear-gradient(135deg,#0B2E63 0%,#12539F 55%,#1668C8 100%);
    color:#fff; padding:44px 24px 40px; text-align:center;
  }
  .hd-eyebrow{
    font-family:var(--font-en); font-size:.78rem; letter-spacing:.14em;
    color:rgba(255,255,255,.75); margin:0 0 14px;
  }
  .hd h1{
    margin:0 0 14px; font-size:clamp(1.4rem,3.4vw,2.2rem); font-weight:900;
    line-height:1.5; letter-spacing:-.015em;
  }
  .hd h1 .hl{ color:#8EC6FF; }
  .hd p{ margin:0; font-size:clamp(.9rem,1.6vw,1rem); font-weight:600; color:rgba(255,255,255,.9); line-height:1.8; }

  /* 相談で分かること */
  .pts{
    max-width:900px; margin:-26px auto 0; padding:0 20px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .pt{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:18px 18px; box-shadow:0 2px 10px rgba(11,37,69,.06), 0 12px 34px rgba(11,37,69,.05);
  }
  .pt b{ display:block; font-size:.92rem; font-weight:700; margin-bottom:6px; color:var(--accent-2); }
  .pt span{ font-size:.84rem; font-weight:500; color:var(--ink-dim); line-height:1.7; }

  /* カレンダー本体。等倍で置くので操作が崩れない */
  .cal{
    max-width:900px; margin:30px auto 0; padding:0 20px 60px;
  }
  .cal-h{
    font-size:1rem; font-weight:700; margin:0 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  .cal-h::before{ content:""; width:26px; height:2px; background:var(--accent); display:block; }
  .cal-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px; box-shadow:0 2px 10px rgba(11,37,69,.06), 0 12px 34px rgba(11,37,69,.05);
    min-height:520px;
  }
  .cal-fb{ margin:14px 0 0; font-size:.84rem; color:var(--ink-dim); line-height:1.8; }
  .cal-fb a{ color:var(--accent-2); font-weight:700; }

  .ft{ text-align:center; padding:0 20px 50px; font-size:.8rem; color:var(--ink-dim); }
  .ft a{ color:var(--accent-2); font-weight:700; text-decoration:none; }

  @media (max-width:760px){
    .pts{ grid-template-columns:1fr; margin-top:-18px; }
    .hd{ padding:34px 18px 34px; }
  }
</style>
</head>
<body>

<header class="hd">
  <p class="hd-eyebrow">AIまるごと採用雑務代行｜株式会社NEXT</p>
  <h1>採用の工数をお伺いして、<br>どれくらい<span class="hl">AIに置換できるか</span><br>無料で相談します！</h1>
  <p>現在の採用工数を一緒に洗い出し、どこがどれだけ減らせるかを算出してお渡しします。</p>
</header>

<section class="pts">
  <div class="pt"><b>いまの工数が分かる</b><span>1名の採用にかかっている時間を、工程ごとに分解します。</span></div>
  <div class="pt"><b>減らせる量が分かる</b><span>そのうちAIに置き換えられる部分と、残る時間を算出します。</span></div>
  <div class="pt"><b>費用の目安が分かる</b><span>御社の採用量に当てはめた場合の、月額の目安をお出しします。</span></div>
</section>

<main class="cal">
  <h2 class="cal-h">ご都合のよい日時をお選びください</h2>
  <div class="cal-box">
    <!-- TimeRex -->
    <div id="timerex_calendar" data-url="https://timerex.net/s/m.inoue_361c_6dde/3ffb8afc"></div>
  </div>
  <p class="cal-fb">
    カレンダーが表示されない場合は、
    <a href="https://timerex.net/s/m.inoue_361c_6dde/3ffb8afc" target="_blank" rel="noopener">こちらのページ</a>
    から直接ご予約いただけます。
  </p>
</main>

<footer class="ft">
  <a href="./">← 資料に戻る</a>
</footer>

<script id="timerex_embed" src="https://asset.timerex.net/js/embed.js"></script>
<script>
  // embed.js の読み込み完了を待ってから描画する（先に呼ぶと何も出ない）
  (function () {
    var tries = 0;
    (function go() {
      if (typeof TimerexCalendar === 'function') { TimerexCalendar(); return; }
      if (++tries > 40) return;          // 約8秒で諦め、上のリンクに誘導
      setTimeout(go, 200);
    })();
  })();
</script>

</body>
</html>
